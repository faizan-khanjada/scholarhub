{% extends "base.html" %}

{% block content %}
<section class="py-12 bg-slate-50 dark:bg-slate-900 min-h-screen transition-colors duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Manage Scholarships</h1>
            <a href="{{ url_for('add_scholarship') }}"
                class="px-4 py-2 bg-primary text-white rounded-lg font-semibold hover:bg-indigo-600 transition-colors shadow-sm">
                <i class="fas fa-plus mr-2"></i> Add New
            </a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" data-aos="fade-up" data-aos-duration="800">
            {% for scholarship in scholarships %}
            <div
                class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 p-6 hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 group">
                <div class="flex justify-between items-start mb-4">
                    <span
                        class="px-2 py-1 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded text-xs font-semibold uppercase group-hover:bg-indigo-50 dark:group-hover:bg-slate-600 transition-colors">
                        {{ scholarship.type }}
                    </span>
                    <span class="font-bold text-primary">{{ scholarship.amount }}</span>
                </div>
                <h3
                    class="text-lg font-bold text-slate-900 dark:text-white mb-2 truncate group-hover:text-primary transition-colors">
                    {{ scholarship.title }}</h3>
                <p class="text-sm text-slate-500 dark:text-slate-400 mb-4 line-clamp-2">
                    {{ scholarship.description }}
                </p>
                <div class="flex items-center justify-between pt-4 border-t border-slate-100 dark:border-slate-700">
                    <div class="text-xs text-slate-500 dark:text-slate-400">
                        Expires: {{ scholarship.deadline }}
                    </div>
                    <div>
                        <a href="{{ url_for('delete_scholarship', scholarship_id=scholarship.id) }}"
                            class="text-red-500 hover:text-red-600 dark:text-red-400 dark:hover:text-red-300 text-sm font-medium transition-transform hover:scale-105 inline-block"
                            onclick="return confirm('Are you sure?')">Delete</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
